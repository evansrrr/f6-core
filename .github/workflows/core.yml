name: f6-core

on:
  push:
    branches: [core]
    tags: ["core-v*"]
  pull_request:
    branches: [core]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.26.3"
  # easytier / tailscale / zerotier are mesh-VPN outbounds; no proxy
  # subscription uses them, so they are compiled out. See F6-CORE.md.
  F6_TAGS: "with_gvisor no_easytier no_zerotier no_tailscale"

jobs:
  check:
    name: compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build every package with the f6 tags
        run: go build -tags "$F6_TAGS" ./...
      - name: Unit tests (config / rules / adapter)
        run: go test -tags "$F6_TAGS" ./config/... ./rules/... ./adapter/...

  build:
    name: build ${{ matrix.target }}
    needs: check
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            goos: windows
            goarch: amd64
            goamd64: v3
            asset: mihomo-windows-amd64-v3.exe
            pack: zip
            max_mb: 42
          - target: windows-amd64-compatible
            goos: windows
            goarch: amd64
            goamd64: v1
            asset: mihomo-windows-amd64-compatible.exe
            pack: zip
            max_mb: 42
          - target: linux-amd64
            goos: linux
            goarch: amd64
            goamd64: v3
            asset: mihomo-linux-amd64
            pack: gz
            max_mb: 44
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            goamd64: ""
            asset: mihomo-darwin-arm64
            pack: gz
            max_mb: 40
          - target: android-arm64
            goos: android
            goarch: arm64
            goamd64: ""
            asset: mihomo-android-arm64-v8
            pack: gz
            max_mb: 46
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.goamd64 }}" ]; then export GOAMD64="${{ matrix.goamd64 }}"; fi
          VERSION="${GITHUB_REF_NAME:-dev-$(git rev-parse --short HEAD)}"
          BUILDTIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p build
          go build -tags "$F6_TAGS" -trimpath \
            -ldflags "-X github.com/metacubex/mihomo/constant.Version=${VERSION} \
                      -X github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME} \
                      -w -s -buildid=" \
            -o "build/${{ matrix.asset }}" .
          ls -l "build/${{ matrix.asset }}"

      # Guards against upstream quietly growing the binary back to 58MB.
      - name: Size guard
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s "build/${{ matrix.asset }}")
          MAX=$(( ${{ matrix.max_mb }} * 1024 * 1024 ))
          printf '%s: %.1f MB (limit %s MB)\n' "${{ matrix.asset }}" "$(echo "$SIZE/1048576" | bc -l)" "${{ matrix.max_mb }}"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::${{ matrix.asset }} is $((SIZE/1048576))MB, over the ${MAX} byte budget"
            exit 1
          fi

      - name: Pack
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev-$(git rev-parse --short HEAD)}"
          cd build
          if [ "${{ matrix.pack }}" = "zip" ]; then
            OUT="$(basename "${{ matrix.asset }}" .exe)-${VERSION}.zip"
            zip -9 -j "$OUT" "${{ matrix.asset }}"
          else
            OUT="${{ matrix.asset }}-${VERSION}.gz"
            gzip -9 -c "${{ matrix.asset }}" > "$OUT"
          fi
          rm -f "${{ matrix.asset }}"
          sha256sum "$OUT" > "$OUT.sha256"
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            build/*
            !build/*.sha256

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # GPL-3.0: the exact source that produced these binaries.
      - name: Source archive
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=f6-core-${GITHUB_REF_NAME}/ \
            -o "dist/f6-core-${GITHUB_REF_NAME}-src.tar.gz" HEAD

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
